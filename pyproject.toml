# pyproject.toml
[project]
name="smart-home-automation"
version= "0.1.0"
requires-python= ">=3.15,<3.16"
dependencies= []

[project.scripts]
server = "smart_home_automation.server:main"
sensor = "smart_home_automation.node:main"
control_panel = "smart_home_automation.control_panel:main"


[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
# Target python version
target-version = "py312"

# Max line length (standard is 88 or 100)
line-length = 100

[tool.ruff.lint]
# Selected rule sets:
# E / W: pycodestyle errors and warnings
# F: Pyflakes (detects undefined names like `logger`, unused imports, etc.)
# I: isort (organizes imports)
# B: flake8-bugbear (common bug patterns)
select = ["E", "W", "F", "I", "B"]

# Rules to ignore (if any)
ignore = []
