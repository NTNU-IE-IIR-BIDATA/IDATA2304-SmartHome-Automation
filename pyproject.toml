# pyproject.toml
[project]
name="smart-home-automation"
version= "0.1.0"
requires-python= ">=3.15,<3.16"
dependencies= []

[project.scripts]
server = "smart_home_automation.server:main"
sensor = "smart_home_automation.sensor:main"
control_panel = "smart_home_automation.control_panel:main"


[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
